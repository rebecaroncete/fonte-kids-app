# =====================================================================
# Fonte Kids – keep-alive do Supabase (plano Free pausa após 7 dias sem uso)
# Roda 1 vez por dia e chama a função keep_alive() do banco, que só
# responde "ok" (não lê nem devolve nenhum dado).
# Usa apenas a URL e a chave PÚBLICA que já estão em app/config.js.
# Nenhum segredo é necessário.
# Obs.: o GitHub desliga agendamentos de repositórios públicos após 60 dias
# sem commits; se isso acontecer, é só reativar em Actions → keep-alive.
# =====================================================================
name: keep-alive

on:
  schedule:
    - cron: "17 9 * * *" # 06:17 em Brasília (09:17 UTC)
  workflow_dispatch: {}   # botão "Run workflow" para rodar à mão

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: supabase-migracao
          sparse-checkout: app/config.js
          sparse-checkout-cone-mode: false

      - name: Chamar keep_alive()
        run: |
          URL=$(grep -oE 'supabaseUrl:[[:space:]]*"[^"]+"' app/config.js | sed -E 's/.*"([^"]+)"/\1/')
          CHAVE=$(grep -oE 'supabaseChavePublica:[[:space:]]*"[^"]+"' app/config.js | sed -E 's/.*"([^"]+)"/\1/')
          if [ -z "$URL" ] || [ -z "$CHAVE" ]; then echo "Não achei a URL ou a chave pública em app/config.js"; exit 1; fi
          for tentativa in 1 2 3; do
            CODIGO=$(curl -s -o resposta.txt -w '%{http_code}' -X POST "$URL/rest/v1/rpc/keep_alive" \
              -H "apikey: $CHAVE" -H "Content-Type: application/json" -d '{}')
            if [ "$CODIGO" = "200" ]; then echo "Supabase respondeu: $(cat resposta.txt)"; exit 0; fi
            echo "Tentativa $tentativa: HTTP $CODIGO"; sleep 30
          done
          exit 1
